<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minna Cards — Japanese Vocabulary Quiz</title>
  <meta name="description" content="A lightweight flashcard app for studying Minna no Nihongo vocabulary. Practice English to Kana and Kana to English.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Screen 1: Setup ===== -->
  <section id="setup-screen" class="screen">
    <header class="app-header">
      <h1 class="app-title">みんなカード</h1>
      <p class="app-subtitle">Minna no Nihongo Vocabulary</p>
    </header>

    <div class="setup-card">
      <div class="setup-group">
        <label class="setup-label">Chapter</label>
        <div id="chapter-select" class="chip-group">
          <!-- Chips generated by JS -->
        </div>
      </div>

      <div class="setup-group">
        <label class="setup-label">Mode</label>
        <div id="mode-select" class="chip-group">
          <button class="chip selected" data-mode="en-to-kana">
            <span class="chip-icon">A→あ</span>
            <span class="chip-text">English → Kana</span>
          </button>
          <button class="chip" data-mode="kana-to-en">
            <span class="chip-icon">あ→A</span>
            <span class="chip-text">Kana → English</span>
          </button>
        </div>
      </div>

      <div class="setup-group">
        <label class="setup-label" for="word-count-input">Words</label>
        <div class="word-count-row">
          <input type="number" id="word-count-input" class="word-count-input" min="1" value="0">
          <span id="word-count-total" class="word-count-total">of 0 words</span>
        </div>
      </div>

      <button id="start-btn" class="btn-primary" disabled>Start Quiz</button>
    </div>
  </section>

  <!-- ===== Screen 2: Quiz ===== -->
  <section id="quiz-screen" class="screen hidden">
    <div class="quiz-header">
      <button id="quit-btn" class="btn-ghost" title="Back to setup">✕</button>
      <div id="progress-indicator" class="progress-indicator">
        <span id="progress-text" class="progress-text">Word 1 of 45</span>
        <div class="progress-bar-track">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
      </div>
      <div id="mode-badge" class="mode-badge">A→あ</div>
    </div>

    <!-- Prompt Card -->
    <div id="prompt-card" class="prompt-card">
      <div id="prompt-text" class="prompt-text"></div>
      <div id="prompt-kanji" class="prompt-kanji"></div>
    </div>

    <!-- Answer Input -->
    <div id="answer-area" class="answer-area">
      <input type="text" id="answer-input" class="answer-input" placeholder="Type your answer..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="answer-buttons">
        <button id="skip-btn" class="btn-secondary">Skip</button>
        <button id="submit-btn" class="btn-primary">Submit</button>
      </div>
    </div>

    <!-- Result Overlay -->
    <div id="result-overlay" class="result-overlay hidden">
      <div id="result-card" class="result-card">
        <div id="result-icon" class="result-icon"></div>
        <div id="result-label" class="result-label"></div>
        <div id="result-answer" class="result-answer"></div>
        <div id="result-kanji" class="result-kanji"></div>
        <div id="result-alts" class="result-alts"></div>
        <button id="continue-btn" class="btn-primary">Continue</button>
        <span class="continue-hint">or press Enter</span>
      </div>
    </div>
  </section>

  <!-- ===== Screen 3: Results ===== -->
  <section id="results-screen" class="screen hidden">
    <div class="results-card">
      <div class="results-icon">🎌</div>
      <h2 class="results-title">Quiz Complete!</h2>
      <div id="results-score" class="results-score"></div>
      <div id="results-detail" class="results-detail"></div>
      <button id="restart-btn" class="btn-primary">Back to Chapters</button>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
